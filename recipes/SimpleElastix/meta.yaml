{% set name = "SimpleElastix" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/SuperElastix/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 42f126b41d70ddf09cfd9f54a559c360eb78b769000be795684743efef39b7ff

build:
  number: 0

requirements:
  build:
    - python
    - cmake    >=3.0  # [not win]
    - libtiff  4.0.*  # [not win]
    - libpng   1.6.*  # [not win]
    - jpeg     8*  # [not win]
    - zlib     1.*  # [not win]
    - setuptools
  run:
    - python
    - libtiff  4.0.*  # [not win]
    - libpng   1.6.*  # [not win]
    - jpeg     8*  # [not win]
    - zlib     1.*  # [not win]

test:
  imports:
    - SimpleITK

about:
  home: http://simpleelastix.github.io/
  license: Apache 2.0
  summary: User-friendly medical image registration library

extra:
  recipe-maintainers:
    - kaspermarstal
    - almarklein
