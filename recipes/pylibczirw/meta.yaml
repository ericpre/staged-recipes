{% set name = "pylibczirw" %}
{% set version = "5.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/pylibczirw-{{ version }}.tar.gz
  sha256: d1c35d8e68cc8c319c4f4e41a01ad2c663ef8b431f01d0571b01d1e31df99040

build:
  skip: true  # [py>=314]
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler('c') }}
  host:
    - python
    - setuptools >=42
    - cmake >=3.18
    - ninja
    - packaging
    - pip
  run:
    - python
    - numpy
    - xmltodict
    - validators

test:
  imports:
    - pylibCZIrw

about:
  summary: A python wrapper around the libCZI C++ library with reading and writing functionality.
  license: LGPL-3.0-only AND GPL-3.0-only AND BSD-3-Clause
  license_file:
    - COPYING
    - COPYING.LESSER
    - libs/libCZIrw/COPYING
    - libs/libCZIrw/COPYING.LESSER
    - libs/pybind11/LICENSE

extra:
  recipe-maintainers:
    - ericpre
